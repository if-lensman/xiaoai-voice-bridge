name: xiaoai-voice-bridge
services:
  relay:
    image: local/xiaoai-voice-bridge:0.1.0
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    container_name: xiaoai-voice-bridge
    restart: unless-stopped
    ports:
      - "${RELAY_BIND_IP:?Set RELAY_BIND_IP in .env}:18878:18878"
    environment:
      LISTEN_HOST: 0.0.0.0
      DEVICE_IP: ${DEVICE_IP:?Set DEVICE_IP in .env}
      TZ: Asia/Shanghai
    volumes:
      - ./private:/app/.secrets:ro
      - ./data:/app/outputs
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
